<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كفتة على الفحم | منيو</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --main: #d4511e;
        --main-light: #ff7a3d;
        --main-dark: #8b2e0a;
        --gold: #ffd700;
        --gold-dark: #daa520;
        --bg-dark: #0a0a0a;
        --bg-card: #1a1a1a;
        --text-main: #ffffff;
        --text-sub: #cccccc;
        --text-muted: #888888;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Cairo", sans-serif;
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a1a 50%,
          #0f0f0f 100%
        );
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* ===== TOP CONTACT BAR ===== */
      .contact-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 70px;
        background: linear-gradient(
          90deg,
          rgba(10, 10, 10, 0.98) 0%,
          rgba(26, 26, 26, 0.98) 100%
        );
        backdrop-filter: blur(20px);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 50px;
        z-index: 1000;
        border-bottom: 4px solid var(--main);
        box-shadow: 0 10px 50px rgba(212, 81, 30, 0.3);
      }

      .contact-item {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 700;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .contact-item:hover {
        color: var(--main-light);
        transform: translateY(-3px);
      }

      .contact-item i {
        font-size: 1.3rem;
        color: var(--main-light);
      }

      /* ===== BOTTOM LOCATION BAR ===== */
      .location-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 65px;
        background: linear-gradient(
          90deg,
          rgba(26, 26, 26, 0.98) 0%,
          rgba(10, 10, 10, 0.98) 100%
        );
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        z-index: 1000;
        border-top: 4px solid var(--main);
        box-shadow: 0 -10px 50px rgba(212, 81, 30, 0.3);
      }

      .location-bar i {
        color: var(--gold);
        animation: pulse 2.5s infinite;
        font-size: 1.2rem;
      }

      .location-bar span {
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.5px;
      }

      /* ===== FLOATING CART ===== */
      .cart-btn {
        position: fixed;
        bottom: 85px;
        left: 25px;
        width: 75px;
        height: 75px;
        background: linear-gradient(
          135deg,
          var(--main-light) 0%,
          var(--main) 100%
        );
        color: var(--text-main);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 15px 50px rgba(255, 122, 61, 0.5);
        cursor: pointer;
        z-index: 1100;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 4px solid var(--gold);
      }

      .cart-btn:hover {
        transform: scale(1.2) rotate(15deg);
        box-shadow: 0 20px 70px rgba(255, 122, 61, 0.7);
      }

      .cart-btn i {
        font-size: 2rem;
      }

      .cart-count {
        position: absolute;
        top: -12px;
        right: -12px;
        background: linear-gradient(135deg, #ff4444, #cc0000);
        color: var(--text-main);
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        font-weight: 900;
        border: 4px solid var(--gold);
        box-shadow: 0 6px 20px rgba(255, 68, 68, 0.5);
      }

      /* ===== HEADER ===== */
      header {
        background: linear-gradient(
          180deg,
          rgba(26, 26, 26, 0.95) 0%,
          rgba(10, 10, 10, 0.9) 100%
        );
        padding: 110px 20px 60px;
        text-align: center;
        margin-top: 70px;
        margin-bottom: 50px;
        position: relative;
        border-bottom: 3px solid var(--main);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .logo-box {
        position: relative;
        width: 220px;
        height: 220px;
        margin: 0 auto 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-frame {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 6px solid var(--main-light);
        border-radius: 50%;
        box-shadow:
          0 0 0 3px var(--gold),
          0 0 0 8px var(--main-light),
          0 0 0 12px rgba(212, 81, 30, 0.3),
          0 0 60px rgba(255, 122, 61, 0.4),
          inset 0 0 50px rgba(212, 81, 30, 0.15);
        animation: spinFrame 25s linear infinite;
      }

      .logo-frame::before {
        content: "";
        position: absolute;
        inset: -20px;
        border: 3px dashed var(--gold);
        border-radius: 50%;
        opacity: 0.7;
        animation: spinDash 35s linear infinite reverse;
      }

      .logo-img {
        width: 180px;
        height: 180px;
        object-fit: contain;
        z-index: 10;
        filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.6));
        animation: floatLogo 4s ease-in-out infinite;
        transition: all 0.4s ease;
        background: transparent;
        padding: 10px;
      }

      .logo-box:hover .logo-img {
        transform: scale(1.15) rotate(8deg);
      }

      .title {
        font-family: "Playfair Display", serif;
        font-size: 4rem;
        font-weight: 900;
        background: linear-gradient(
          135deg,
          var(--main-light) 0%,
          var(--gold) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 12px;
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 1.2rem;
        color: var(--gold);
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 35px;
        position: relative;
        display: inline-block;
      }

      .subtitle::before,
      .subtitle::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40px;
        height: 2px;
        background: linear-gradient(90deg, var(--main-light), transparent);
        transform: translateY(-50%);
      }

      .subtitle::before {
        right: 100%;
        margin-right: 20px;
      }

      .subtitle::after {
        left: 100%;
        margin-left: 20px;
        background: linear-gradient(90deg, transparent, var(--main-light));
      }

      /* ===== SOCIAL LINKS ===== */
      .social {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 40px 0 45px;
      }

      .social a {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--bg-card), var(--bg-dark));
        border: 2px solid var(--main);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
      }

      .social a::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--main-light), var(--gold));
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: -1;
      }

      .social a:hover::before {
        opacity: 0.2;
      }

      .social a:hover {
        transform: translateY(-8px) scale(1.15);
        box-shadow: 0 15px 40px rgba(212, 81, 30, 0.4);
        border-color: var(--gold);
      }

      .social a i {
        position: relative;
        z-index: 2;
      }

      .social a.facebook i {
        color: #1877f2;
      }

      .social a.tiktok i {
        color: #000;
        text-shadow:
          2px 0 #ff0050,
          -2px 0 #00f2ea;
      }

      .social a.tiktok:hover i {
        color: #fff;
        text-shadow: none;
      }

      .social a.whatsapp i {
        color: #25d366;
      }

      .social a:hover i {
        color: white;
      }

      /* ===== SEARCH ===== */
      .search-box {
        max-width: 850px;
        margin: 0 auto 35px;
        padding: 0 20px;
      }

      .search-input {
        position: relative;
        margin-bottom: 30px;
      }

      .search-input input {
        width: 100%;
        padding: 18px 55px 18px 25px;
        border-radius: 15px;
        border: 2px solid var(--main);
        outline: none;
        background: var(--bg-card);
        font-size: 1.05rem;
        font-family: "Cairo", sans-serif;
        color: var(--text-main);
        transition: all 0.4s ease;
      }

      .search-input input::placeholder {
        color: var(--text-muted);
      }

      .search-input input:focus {
        border-color: var(--main-light);
        box-shadow: 0 0 0 6px rgba(255, 122, 61, 0.15);
        background: linear-gradient(
          135deg,
          var(--bg-card),
          rgba(212, 81, 30, 0.05)
        );
      }

      .search-input i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--main-light);
        font-size: 1.3rem;
      }

      /* ===== CATEGORIES ===== */
      .categories {
        display: flex;
        gap: 15px;
        overflow-x: auto;
        padding: 10px 0;
        scrollbar-width: thin;
        scrollbar-color: var(--main) transparent;
      }

      .categories::-webkit-scrollbar {
        height: 6px;
      }

      .categories::-webkit-scrollbar-thumb {
        background: var(--main);
        border-radius: 3px;
      }

      .cat-btn {
        padding: 14px 32px;
        background: var(--bg-card);
        border: 2px solid var(--main);
        border-radius: 25px;
        cursor: pointer;
        white-space: nowrap;
        font-weight: 700;
        font-size: 1rem;
        font-family: "Cairo", sans-serif;
        color: var(--text-main);
        transition: all 0.4s ease;
        flex-shrink: 0;
        position: relative;
        overflow: hidden;
      }

      .cat-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--main-light), var(--gold));
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: -1;
      }

      .cat-btn:hover::before {
        opacity: 0.3;
      }

      .cat-btn:hover {
        border-color: var(--main-light);
        color: var(--gold);
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(212, 81, 30, 0.2);
      }

      .cat-btn.active {
        background: linear-gradient(
          135deg,
          var(--main-light) 0%,
          var(--main) 100%
        );
        color: var(--text-main);
        border-color: var(--gold);
        box-shadow: 0 15px 40px rgba(255, 122, 61, 0.4);
        transform: translateY(-5px) scale(1.05);
      }

      /* ===== MENU GRID ===== */
      .menu-container {
        padding: 30px 20px;
        margin-bottom: 80px;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1700px;
        margin: 0 auto;
      }

      .product {
        background: linear-gradient(
          135deg,
          var(--bg-card) 0%,
          rgba(26, 26, 26, 0.7) 100%
        );
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 2px solid transparent;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .product::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 122, 61, 0.1),
          rgba(212, 81, 30, 0.05)
        );
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
        pointer-events: none;
      }

      .product:hover {
        transform: translateY(-25px);
        box-shadow: 0 35px 90px rgba(255, 122, 61, 0.35);
        border-color: var(--main-light);
      }

      .product:hover::before {
        opacity: 1;
      }

      .product-img {
        width: 100%;
        height: 300px;
        object-fit: cover;
        transition: all 0.5s ease;
        position: relative;
        z-index: 2;
      }

      .product:hover .product-img {
        transform: scale(1.15);
      }

      .product-info {
        padding: 30px;
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
      }

      .product-name {
        font-weight: 800;
        font-size: 1.5rem;
        margin-bottom: 12px;
        color: var(--text-main);
        letter-spacing: -0.5px;
      }

      .product-desc {
        font-size: 0.95rem;
        color: var(--text-muted);
        margin-bottom: 18px;
        line-height: 1.5;
        flex: 1;
      }

      .product-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(212, 81, 30, 0.2);
      }

      .price {
        display: flex;
        flex-direction: column;
      }

      .price-amount {
        color: var(--gold);
        font-weight: 900;
        font-size: 1.8rem;
        letter-spacing: -1px;
      }

      .price-unit {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 600;
      }

      .add-btn {
        padding: 14px 28px;
        border: none;
        background: linear-gradient(
          135deg,
          var(--main-light) 0%,
          var(--main) 100%
        );
        color: var(--text-main);
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.4s ease;
        font-size: 1rem;
        font-family: "Cairo", sans-serif;
        box-shadow: 0 8px 25px rgba(255, 122, 61, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .add-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 35px rgba(255, 122, 61, 0.5);
      }

      /* ===== CART SIDEBAR ===== */
      .cart-sidebar {
        position: fixed;
        left: -100%;
        top: 0;
        width: 100%;
        max-width: 520px;
        height: 100%;
        background: linear-gradient(
          180deg,
          var(--bg-card) 0%,
          var(--bg-dark) 100%
        );
        z-index: 2000;
        box-shadow: -15px 0 60px rgba(0, 0, 0, 0.7);
        transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        padding: 25px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        border-left: 4px solid var(--main);
      }

      .cart-sidebar.open {
        left: 0;
      }

      .cart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 25px;
        border-bottom: 2px solid var(--main);
      }

      .cart-header h2 {
        font-size: 1.9rem;
        color: var(--text-main);
        font-weight: 900;
        letter-spacing: -1px;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 2rem;
        cursor: pointer;
        color: var(--text-main);
        transition: all 0.3s ease;
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }

      .close-btn:hover {
        background: rgba(212, 81, 30, 0.2);
        color: var(--main-light);
        transform: rotate(90deg);
      }

      .cart-items {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 25px;
      }

      .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid rgba(212, 81, 30, 0.15);
      }

      .item-info {
        flex: 1;
      }

      .item-name {
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 6px;
        font-size: 1.05rem;
      }

      .item-price {
        color: var(--gold);
        font-weight: 900;
        font-size: 1.2rem;
      }

      .qty-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(212, 81, 30, 0.15);
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(212, 81, 30, 0.3);
      }

      .qty-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 900;
        color: var(--main-light);
        font-size: 1.2rem;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .qty-btn:hover {
        transform: scale(1.25);
        color: var(--gold);
      }

      .qty-num {
        font-weight: 800;
        color: var(--text-main);
        min-width: 25px;
        text-align: center;
        font-size: 1.1rem;
      }

      .cart-total {
        padding: 25px;
        background: linear-gradient(
          135deg,
          rgba(212, 81, 30, 0.15) 0%,
          rgba(255, 215, 0, 0.08) 100%
        );
        border-radius: 18px;
        margin-bottom: 25px;
        border: 2px solid var(--main);
        box-shadow: 0 10px 30px rgba(212, 81, 30, 0.15);
      }

      .total-label {
        font-size: 1rem;
        color: var(--text-muted);
        margin-bottom: 10px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .total-value {
        font-size: 2.3rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--main-light), var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -1px;
      }

      .checkout-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
        color: var(--text-main);
        border: none;
        border-radius: 15px;
        font-weight: 900;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: "Cairo", sans-serif;
        box-shadow: 0 12px 40px rgba(37, 211, 102, 0.4);
        letter-spacing: 0.5px;
      }

      .checkout-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 16px 50px rgba(37, 211, 102, 0.6);
      }

      .checkout-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ===== NEW: CASHIER BUTTON ===== */
      .cashier-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(
          135deg,
          var(--main-light) 0%,
          var(--main) 100%
        );
        color: var(--text-main);
        border: none;
        border-radius: 15px;
        font-weight: 900;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: "Cairo", sans-serif;
        box-shadow: 0 12px 40px rgba(212, 81, 30, 0.4);
        letter-spacing: 0.5px;
        margin-top: 12px;
      }

      .cashier-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 16px 50px rgba(212, 81, 30, 0.6);
      }

      .cashier-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .cart-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* ===== MODAL ===== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        z-index: 3000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeIn 0.3s ease;
      }

      .modal-overlay.active {
        display: flex;
      }

      .modal-card {
        background: linear-gradient(145deg, var(--bg-card), var(--bg-dark));
        border-radius: 30px;
        max-width: 580px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 35px 30px;
        border: 2px solid var(--main);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
        animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        scrollbar-width: thin;
        scrollbar-color: var(--main) transparent;
      }

      .modal-card::-webkit-scrollbar {
        width: 6px;
      }

      .modal-card::-webkit-scrollbar-thumb {
        background: var(--main);
        border-radius: 3px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 20px;
        border-bottom: 2px solid rgba(212, 81, 30, 0.3);
      }

      .modal-header h2 {
        font-size: 1.7rem;
        font-weight: 900;
        color: var(--text-main);
        letter-spacing: -1px;
      }

      .modal-header h2 i {
        color: var(--main-light);
        margin-left: 10px;
      }

      .modal-close {
        background: none;
        border: none;
        font-size: 1.8rem;

    <script>
      // ============================================================
      //  EXISTING CODE (unchanged)
      // ============================================================

      const firebaseConfig = {
        apiKey: "AIzaSyAI8AjUMmUdIP2IIchf7XTYZ2hcCa79aQ8",
        authDomain: "kofta-b2885.firebaseapp.com",
        projectId: "kofta-b2885",
        appId: "1:622180720773:web:b75bee4745d5a5482449ec",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let products = [];
      let cart = [];
      let activeCategory = "all";

      // إعدادات توجيه طلبات المنيو:
      // أنشئ مستند settings/order_routing في Firestore وضع:
      // cashierUserId / cashierUsername / cashierName
      // deliveryUserId / deliveryUsername / deliveryName
      const ORDER_ROUTING_SETTINGS_ID = "order_routing";

      async function loadData() {
        try {
          const catSnap = await db
            .collection("categories")
            .doc("all_categories")
            .get();
          const categories = catSnap.data().data;
          const catList = document.getElementById("catList");

          catList.innerHTML = `<button class="cat-btn active" onclick="setCategory('all', this)">الكل</button>`;
          categories.forEach((c) => {
            catList.innerHTML += `<button class="cat-btn" onclick="setCategory('${c.id}', this)">${c.name}</button>`;
          });

          const prodSnap = await db
            .collection("products")
            .doc("all_products")
            .get();
          products = prodSnap.data().data.filter((p) => p.available !== false);
          displayProducts(products);
        } catch (e) {
          console.error("Error:", e);
        }
      }

      function displayProducts(items) {
        const grid = document.getElementById("menuGrid");
        if (items.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;"><i class="fas fa-search" style="font-size: 2rem; margin-bottom: 15px;"></i><p>لم نجد منتجات</p></div>`;
          return;
        }

        grid.innerHTML = items
          .map(
            (p) => `
                <div class="product fade-in">
                    <img src="${p.image}" class="product-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 300%22%3E%3Crect fill=%22%23333%22 width=%22300%22 height=%22300%22/%3E%3Ctext x=%22150%22 y=%22150%22 font-size=%2220%22 fill=%22%23666%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3Eصورة%3C/text%3E%3C/svg%3E'" />
                    <div class="product-info">
                        <h3 class="product-name">${p.name}</h3>
                        <p class="product-desc">${p.description || "منتج لذيذ"}</p>
                        <div class="product-bottom">
                            <div class="price">
                                <div class="price-amount">${p.price}</div>
                                <div class="price-unit">SDG</div>
                            </div>
                            <button class="add-btn" onclick="addToCart('${p.id}')">
                                <i class="fas fa-plus"></i> إضافة
                            </button>
                        </div>
                    </div>
                </div>
            `,
          )
          .join("");
      }

      function setCategory(id, el) {
        activeCategory = id;
        document
          .querySelectorAll(".cat-btn")
          .forEach((b) => b.classList.remove("active"));
        el.classList.add("active");
        filterProducts();
      }

      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("searchBox")
          .addEventListener("input", filterProducts);
      });

      function filterProducts() {
        const query = document.getElementById("searchBox").value.toLowerCase();
        const filtered = products.filter((p) => {
          const matchCat =
            activeCategory === "all" || p.category === activeCategory;
          const matchSearch = p.name.toLowerCase().includes(query);
          return matchCat && matchSearch;
        });
        displayProducts(filtered);
      }

      function addToCart(id) {
        const p = products.find((x) => x.id === id);
        const exist = cart.find((x) => x.id === id);
        if (exist) exist.qty++;
        else cart.push({ ...p, qty: 1 });
        updateCart();

        const btn = document.querySelector(".cart-btn");
        btn.style.transform = "scale(1.3) rotate(20deg)";
        setTimeout(() => (btn.style.transform = "scale(1) rotate(0deg)"), 300);
      }

      function changeQty(id, n) {
        const item = cart.find((x) => x.id === id);
        item.qty += n;
        if (item.qty <= 0) cart = cart.filter((x) => x.id !== id);
        updateCart();
      }

      function updateCart() {
        const total = cart.reduce((a, b) => a + b.qty, 0);
        document.getElementById("cartCount").innerText = total;

        const content = document.getElementById("cartContent");
        if (cart.length === 0) {
          content.innerHTML = `<div class="empty-msg"><i class="fas fa-shopping-basket"></i><p>السلة فارغة</p></div>`;
          document.getElementById("checkoutBtn").disabled = true;
          document.getElementById("cashierBtn").disabled = true;
        } else {
          content.innerHTML = cart
            .map(
              (c) => `
                    <div class="cart-item">
                        <div class="item-info">
                            <div class="item-name">${c.name}</div>
                            <div class="item-price">${c.price * c.qty} SDG</div>
                        </div>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="changeQty('${c.id}', -1)">−</button>
                            <span class="qty-num">${c.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${c.id}', 1)">+</button>
                        </div>
                    </div>
                `,
            )
            .join("");
          document.getElementById("checkoutBtn").disabled = false;
          document.getElementById("cashierBtn").disabled = false;
        }

        const sum = cart.reduce((a, b) => a + b.price * b.qty, 0);
        document.getElementById("totalPrice").innerText = `${sum} SDG`;
      }

      function toggleCart() {
        document.getElementById("cartSidebar").classList.toggle("open");
        document.body.classList.toggle("no-scroll");
      }

      // EXISTING checkout() – UNCHANGED
      function checkout() {
        if (cart.length === 0) return;
        let msg = "🍖 *طلب جديد من كفتة على الفحم* 🔥\n\n";
        cart.forEach((c) => (msg += `✓ ${c.name} × ${c.qty}\n`));
        const total = cart.reduce((a, b) => a + b.price * b.qty, 0);
        msg += `\n💰 *الإجمالي: ${total} SDG*\n📍 *الموقع:* دنقلا - شرق مستشفى الشرطة`;
        window.open(
          `https://wa.me/+249125088500?text=${encodeURIComponent(msg)}`,
          "_blank",
        );
      }

      loadData();

      // ============================================================
      //  NEW CODE: CASHIER ORDER MODAL
      // ============================================================

      // ---------- State ----------
      let selectedOrderType = null; // 'sala' | 'estlam' | 'tawseel'
      let selectedTable = null; // number or null
      let menuUsers = [];
      let eligibleAssignees = [];
      let selectedAssignee = null;

      // ---------- DOM refs ----------
      const modalOverlay = document.getElementById("cashierModal");
      const salaFields = document.getElementById("salaFields");
      const estlamFields = document.getElementById("estlamFields");
      const tawseelFields = document.getElementById("tawseelFields");
      const tableGrid = document.getElementById("tableGrid");
      const modalSubmitBtn = document.getElementById("modalSubmitBtn");
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const assigneeSelect = document.getElementById("orderAssignee");
      const assigneeHint = document.getElementById("assigneeHint");

      // ---------- Generate table buttons (1–20) ----------
      function buildTableButtons() {
        tableGrid.innerHTML = "";
        for (let i = 1; i <= 20; i++) {
          const btn = document.createElement("button");
          btn.className = "table-btn";
          btn.textContent = i;
          btn.dataset.table = i;
          btn.onclick = () => selectTable(i, btn);
          tableGrid.appendChild(btn);
        }
      }
      buildTableButtons();

      // ---------- Open modal ----------
      function openCashierModal() {
        if (cart.length === 0) {
          showToast("⚠️ السلة فارغة، أضف منتجات أولاً.");
          return;
        }

        // Reset state
        selectedOrderType = null;
        selectedTable = null;
        selectedAssignee = null;
        eligibleAssignees = [];
        modalSubmitBtn.disabled = true;
        assigneeSelect.disabled = true;
        assigneeSelect.innerHTML =
          '<option value="">جاري تحميل المستخدمين...</option>';

        // Hide all dynamic fields
        salaFields.classList.remove("visible");
        estlamFields.classList.remove("visible");
        tawseelFields.classList.remove("visible");

        // Clear inputs
        document.getElementById("estlamPhone").value = "";
        document.getElementById("estlamName").value = "";
        document.getElementById("tawseelPhone").value = "";
        document.getElementById("tawseelAddress").value = "";
        document.getElementById("orderNotes").value = "";

        // Reset table buttons
        document
          .querySelectorAll(".table-btn")
          .forEach((b) => b.classList.remove("active"));

        // Reset order type buttons
        document
          .querySelectorAll(".order-type-btn")
          .forEach((b) => b.classList.remove("active"));

        modalOverlay.classList.add("active");
        document.body.classList.add("no-scroll");

        // تحميل المستخدمين من نفس قائمة users التي يديرها المدير
        loadMenuUsers().then(() => {
          if (selectedOrderType) populateAssigneeSelect();
        });
      }

      // ---------- Close modal ----------
      function closeCashierModal() {
        modalOverlay.classList.remove("active");
        document.body.classList.remove("no-scroll");
      }

      // Close on overlay click
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeCashierModal();
      });

      // ---------- Select order type ----------
      function selectOrderType(type) {
        selectedOrderType = type;
        selectedTable = null;

        // Update buttons
        document.querySelectorAll(".order-type-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.type === type);
        });

        // Hide all
        salaFields.classList.remove("visible");
        estlamFields.classList.remove("visible");
        tawseelFields.classList.remove("visible");

        // Reset table selection
        document
          .querySelectorAll(".table-btn")
          .forEach((b) => b.classList.remove("active"));

        // Show relevant fields
        if (type === "sala") {
          salaFields.classList.add("visible");
        } else if (type === "estlam") {
          estlamFields.classList.add("visible");
        } else if (type === "tawseel") {
          tawseelFields.classList.add("visible");
        }

        selectedAssignee = null;
        populateAssigneeSelect();
        validateModal();
      }

      // ---------- Select table ----------
      function selectTable(num, btn) {
        if (selectedOrderType !== "sala") return;
        selectedTable = num;
        document
          .querySelectorAll(".table-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        validateModal();
      }

      // ---------- Validate modal ----------
      function validateModal() {
        let valid = false;

        if (!selectedOrderType || !selectedAssignee) {
          modalSubmitBtn.disabled = true;
          return;
        }

        if (selectedOrderType === "sala") {
          valid = selectedTable !== null;
        } else if (selectedOrderType === "estlam") {
          const phone = document.getElementById("estlamPhone").value.trim();
          valid = phone.length > 0;
        } else if (selectedOrderType === "tawseel") {
          const phone = document.getElementById("tawseelPhone").value.trim();
          const address = document
            .getElementById("tawseelAddress")
            .value.trim();
          valid = phone.length > 0 && address.length > 0;
        }

        modalSubmitBtn.disabled = !valid;
      }

      // Attach input listeners for validation
      document
        .getElementById("estlamPhone")
        .addEventListener("input", validateModal);
      document
        .getElementById("estlamName")
        .addEventListener("input", validateModal);
      document
        .getElementById("tawseelPhone")
        .addEventListener("input", validateModal);
      document
        .getElementById("tawseelAddress")
        .addEventListener("input", validateModal);

      // ---------- Submit order to Firestore ----------
      async function submitCashierOrder() {
        if (cart.length === 0) {
          showToast("⚠️ السلة فارغة!");
          return;
        }

        if (!selectedOrderType) {
          showToast("⚠️ اختر نوع الطلب أولاً.");
          return;
        }

        if (!selectedAssignee) {
          showToast("⚠️ اختر المستخدم الذي سيستلم الطلب.");
          return;
        }

        // Gather data
        let orderData = {
          orderType: selectedOrderType,
          items: cart.map((c) => ({
            id: c.id,
            name: c.name,
            price: c.price,
            qty: c.qty,
          })),
          total: cart.reduce((a, b) => a + b.price * b.qty, 0),
          notes: document.getElementById("orderNotes").value.trim() || "",
          status: "pending",
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        };

        // Type-specific fields
        if (selectedOrderType === "sala") {
          orderData.tableNumber = selectedTable;
          orderData.phone = "";
          orderData.customerName = "";
          orderData.address = "";
        } else if (selectedOrderType === "estlam") {
          orderData.tableNumber = null;
          orderData.phone = document.getElementById("estlamPhone").value.trim();
          orderData.customerName =
            document.getElementById("estlamName").value.trim() || "";
          orderData.address = "";
        } else if (selectedOrderType === "tawseel") {
          orderData.tableNumber = null;
          orderData.phone = document
            .getElementById("tawseelPhone")
            .value.trim();
          orderData.customerName = "";
          orderData.address = document
            .getElementById("tawseelAddress")
            .value.trim();
        }

        // ---- حفظ المستخدم الذي اختاره العميل حسب نوع الطلب ----
        try {
          const assignee = selectedAssignee;
          orderData.routingRole = getRoutingRole(selectedOrderType);
          orderData.assignedUserId =
            assignee.id || assignee.uid || assignee.username;
          orderData.assignedUsername = assignee.username || "";
          orderData.assignedUserName = assignee.name || assignee.username || "";
          // حقول توافقية مع أي شاشة قديمة تعتمد cashierId/cashierName
          orderData.cashierId = orderData.assignedUserId;
          orderData.cashierName = orderData.assignedUserName;
          orderData.cashierType = orderData.routingRole;

          // ---- حفظ الطلب كمستند مستقل لظهوره فوراً في شاشة الكاشير ----
          await db.collection("orders").add(orderData);

          // ---- Success ----
          showToast("✅ تم إرسال الطلب إلى الكاشير بنجاح!");
          cart = [];
          updateCart();
          closeCashierModal();
        } catch (err) {
          console.error("Error saving order:", err);
          showToast("❌ حدث خطأ، حاول مرة أخرى.");
        }
      }

      // ---------- تحديد المستخدم المعيّن للطلب ----------
      function getRoutingRole(orderType) {
        // sala = محلي/صالة، أما الاستلام والتوصيل فهما ضمن مستخدم الدليفري
        return ["sala", "hall", "takeout"].includes(orderType)
          ? "cashier"
          : "delivery";
      }

      async function loadMenuUsers() {
        try {
          const snap = await db.collection("users").doc("all_users").get();
          const data = snap.exists ? snap.data() || {} : {};
          menuUsers = Array.isArray(data.data) ? data.data : [];
        } catch (error) {
          console.error("❌ تعذر تحميل مستخدمي المنيو:", error);
          menuUsers = [];
          showToast("❌ تعذر تحميل قائمة المستخدمين.");
        }
      }

      function populateAssigneeSelect() {
        if (!assigneeSelect) return;
        if (!selectedOrderType) {
          assigneeSelect.disabled = true;
          assigneeSelect.innerHTML =
            '<option value="">اختر نوع الطلب أولاً</option>';
          selectedAssignee = null;
          return;
        }

        const routingRole = getRoutingRole(selectedOrderType);
        const allowedRoles =
          routingRole === "cashier"
            ? ["cashier", "cashier_delivery"]
            : ["delivery", "cashier_delivery"];
        eligibleAssignees = menuUsers.filter((user) =>
          allowedRoles.includes(user.role),
        );

        assigneeSelect.innerHTML =
          '<option value="">اختر المستخدم المستلم</option>';
        eligibleAssignees.forEach((user, index) => {
          const key = String(user.username || user.id || user.uid || index);
          const option = document.createElement("option");
          option.value = key;
          option.textContent = `${user.name || user.username || "مستخدم"}${user.role === "cashier_delivery" ? " (كاشير ودليفري)" : ""}`;
          assigneeSelect.appendChild(option);
        });
        assigneeSelect.disabled = eligibleAssignees.length === 0;
        if (assigneeHint) {
          assigneeHint.textContent =
            eligibleAssignees.length > 0
              ? routingRole === "cashier"
                ? "اختر كاشيراً لاستلام طلب الصالة/المحلي."
                : "اختر مستخدم الدليفري لاستلام طلب التوصيل أو الاستلام."
              : routingRole === "cashier"
                ? "لا يوجد مستخدم كاشير مضاف حالياً."
                : "لا يوجد مستخدم دليفري مضاف حالياً.";
        }
        selectedAssignee = null;
        validateModal();
      }

      assigneeSelect.addEventListener("change", () => {
        const selectedKey = assigneeSelect.value;
        selectedAssignee =
          eligibleAssignees.find(
            (user, index) =>
              String(user.username || user.id || user.uid || index) ===
              selectedKey,
          ) || null;
        validateModal();
      });

      // ---------- Helper: default cashier name ----------
      function getDefaultCashierName(type) {
        const map = {
          sala: "كاشير الصالة",
          estlam: "كاشير الاستلام والدليفري",
          tawseel: "كاشير التوصيل",
        };
        return map[type] || "كاشير";
      }

      // ---------- Toast ----------
      let toastTimer = null;

      function showToast(msg) {
        toastMsg.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 3500);
      }

      // ---------- Auto-close modal on Escape ----------
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modalOverlay.classList.contains("active")) {
          closeCashierModal();
        }
      });

      // ---------- (Optional) seed cashiers if missing ----------
      async function seedCashiersIfMissing() {
        const types = ["sala", "estlam", "tawseel"];
        const names = {
          sala: "كاشير الصالة",
          estlam: "كاشير الاستلام",
          tawseel: "كاشير التوصيل",
        };
        for (const t of types) {
          const ref = db.collection("cashiers").doc(t);
          const snap = await ref.get();
          if (!snap.exists) {
            await ref.set({
              id: t,
              name: names[t],
              type: t,
            });
          }
        }
      }
      // Run once on load
      seedCashiersIfMissing().catch(console.warn);
    </script>
  </body>
</html>
